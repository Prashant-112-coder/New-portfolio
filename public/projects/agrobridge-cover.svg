<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="16" fill="#06121e"/>
  <circle cx="400" cy="200" r="180" fill="#06b6d4" fill-opacity="0.08" filter="blur(60px)"/>
  <circle cx="580" cy="300" r="140" fill="#10b981" fill-opacity="0.08" filter="blur(60px)"/>
  
  <!-- Grid Matrix -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="550" y1="0" x2="550" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Satellite Terminal Card -->
  <rect x="80" y="70" width="640" height="360" rx="14" fill="#0d1c2d" fill-opacity="0.8" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5"/>
  
  <!-- Card Header -->
  <rect x="80" y="70" width="640" height="46" rx="14" fill="#0a1624"/>
  <circle cx="110" cy="93" r="5" fill="#ef4444"/>
  <circle cx="126" cy="93" r="5" fill="#f59e0b"/>
  <circle cx="142" cy="93" r="5" fill="#10b981"/>
  <text x="170" y="98" fill="#94a3b8" font-family="monospace" font-size="13">agrobridge-ai // satellite-ndvi-stream:8000</text>

  <!-- NDVI Diagnostic Map Representation -->
  <rect x="110" y="140" width="280" height="250" rx="8" fill="#06121d" stroke="#ffffff" stroke-opacity="0.08"/>
  <polygon points="130,340 180,240 250,290 310,210 360,260 360,360 130,360" fill="#10b981" fill-opacity="0.25"/>
  <polyline points="130,340 180,240 250,290 310,210 360,260" fill="none" stroke="#10b981" stroke-width="3"/>
  <circle cx="310" cy="210" r="5" fill="#38bdf8"/>
  <text x="130" y="170" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">NDVI VEGETATION INDEX</text>
  <text x="130" y="195" fill="#10b981" font-family="monospace" font-size="20" font-weight="bold">0.82 healthy</text>

  <!-- Soil & Sensor Telemetry Metrics -->
  <rect x="410" y="140" width="280" height="74" rx="8" fill="#0b1726" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="430" y="165" fill="#94a3b8" font-family="monospace" font-size="11">MOISTURE CONTENT</text>
  <text x="430" y="195" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">64.2% Optimal</text>

  <rect x="410" y="228" width="280" height="74" rx="8" fill="#0b1726" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="430" y="253" fill="#94a3b8" font-family="monospace" font-size="11">SENTINEL-2 SATELLITE PASS</text>
  <text x="430" y="283" fill="#06b6d4" font-family="sans-serif" font-size="18" font-weight="bold">L2A Orthorectified</text>

  <rect x="410" y="316" width="280" height="74" rx="8" fill="#0b1726" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="430" y="341" fill="#94a3b8" font-family="monospace" font-size="11">PREDICTIVE ADVISORY</text>
  <text x="430" y="371" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="bold">Zero crop stress detected</text>
</svg>
